<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    function getCurrentAge(birthYear) {
      return new Date().getFullYear() - birthYear;
    }
    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    // Array.prototype.every() // is everyone 19 or older?
    const hasAtleastOne19OrOlder = people.some(person => getCurrentAge(person.year) >= 19);
    const hasAll19OrOlder = people.every(person => getCurrentAge(person.year) >= 19);
    // console.log(hasAtleastOne19OrOlder, hasAll19OrOlder);
    
    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423
    function getComment(id) {
      const comment = comments.find(c => c.id === id);
      return comment;
    }
    // console.log(getComment(823423));

    // Array.prototype.findIndex()
    // Find the comment with this ID
    function getCommentIdx(id) {
      const commentIdx = comments.findIndex(c => c.id === id);
      return commentIdx;
    }
    // console.log(getCommentIdx(823423));

    // delete the comment with the ID of 823423
    function deleteComment(id) {
      comments.splice(getCommentIdx(id), 1);
    }
    deleteComment(823423);
    // console.log(getComment(823423));
  </script>
</body>
</html>
